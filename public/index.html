<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deflate Lens</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to the reading</a>
<header class="top">
  <span class="brand">Deflate Lens</span>
  <span class="chip" id="storeChip" hidden><span class="dot"></span><span id="storeText"></span></span>
  <nav class="top-nav" aria-label="App">
    <button class="nav-btn" id="readingsBtn" type="button" aria-expanded="false" aria-controls="readings">Readings</button>
    <button class="nav-btn" id="controlsBtn" type="button" aria-expanded="false" aria-controls="controls">Controls</button>
  </nav>
</header>

<main id="main" tabindex="-1">
  <div class="column">
    <div id="welcome" hidden></div>
    <div id="runView"></div>
    <article id="guideView" class="guide" hidden></article>
  </div>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="panel left" id="readings" hidden role="dialog" aria-modal="true" aria-labelledby="readings-h">
  <div class="panel-head"><h2 id="readings-h">Readings</h2><button class="panel-close" type="button" aria-label="Close Readings">Close</button></div>
  <button class="btn primary wide" id="newRun" type="button">New reading</button>
  <ul class="runs" id="runList"></ul>
  <div id="trash" hidden></div>
</aside>
<aside class="panel right" id="controls" hidden role="dialog" aria-modal="true" aria-labelledby="controls-h">
  <div class="panel-head"><h2 id="controls-h">Controls</h2><button class="panel-close" type="button" aria-label="Close Controls">Close</button></div>
  <div id="controlsBody"></div>
</aside>
<p class="visually-hidden" id="say" role="status" aria-live="polite"></p>

<script src="/shared/transcript.js"></script>
<script src="/shared/prompts.js"></script>
<script src="/app.js"></script>
</body>
</html>
